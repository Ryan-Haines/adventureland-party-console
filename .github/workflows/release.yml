name: Validate and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm --prefix dashboard ci
      - run: node tools/caracal/setup.mts
      - run: npm --prefix .caracal ci
      - run: node scripts/ci/restore-game-fixtures.cjs
      - name: Full regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/ci
          npm run test:ci 2>&1 | tee .build/ci/regression.tap
          node scripts/ci/check-regression.cjs .build/ci/regression.tap
      - run: node node_modules/oxlint/bin/oxlint --config runtime/.oxlintrc.json runtime/coordinator
      - run: npm run build
  version:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm ci
      - id: next
        run: node tools/release/next.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: ./scripts/setup-caracal.ps1
      - run: node tools/dashboard/build.mts
        env:
          AL_DASHBOARD_OUT_DIR: .build/container
      - run: node tools/release/payload.mts ${{ needs.version.outputs.version }}
      - name: Package editable installation
        shell: pwsh
        run: |
          tar.exe -a -c -f .build/release/adventureland-party-console-${{ needs.version.outputs.version }}-windows-x64.zip -C .build/release/windows .
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Verify clean package startup
        run: node tools/release/smoke.mts .build/release/windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: .build/release/*.zip
  docker:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ryan-haines/adventureland-party-console:${{ needs.version.outputs.version }}
          build-args: |
            RELEASE_VERSION=${{ needs.version.outputs.version }}
            RELEASE_COMMIT=${{ github.sha }}
      - name: Smoke-test both architectures
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform linux/$arch --entrypoint node ghcr.io/ryan-haines/adventureland-party-console@${{ steps.build.outputs.digest }} --check .build/runtime/coordinator-application.cjs
          done
  publish:
    needs: [version, windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: .build/release
      - run: node tools/release/manifest.mts ${{ needs.version.outputs.version }} ${{ needs.docker.outputs.digest }}
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote validated image
        run: docker buildx imagetools create --tag ghcr.io/ryan-haines/adventureland-party-console:latest ghcr.io/ryan-haines/adventureland-party-console@${{ needs.docker.outputs.digest }}
